<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="">
        <title>Calculadora de Média Escolares</title>
    </head>
    <body>
        <main class="container">
            <h1>Calculadora de Média - Lógica de Programação</h1>
            <form id="">


            <label for="nota1">Nota 1º Trimestre:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" required />
            <label for="nota2">Nota 2º Trimestre:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" required />
            <label for="nota3">Nota 3º Trimestre:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" required />
            <label for="nota4">Nota 4º Trimestre:</label>
            <input type="number" id="nota4" min="0" max="10" step="0.1" required />
            </form>
            <div class="filtro">
                <input type="text" id="filtro-nome" placeholder="Filtrar por nome do aluno" />
                <button id="filtrar-historico">Filtrar Histórico</button>
            </div>
            <button id="ver-historico">Ver Histórico</button>
            <button id="limpar-historico">Limpar Histórico</button>
            <div id="modal" class="modal">
                <div class="modal-conteudo">
                    <span class="fecha">&times</span>
                    <div id="resultado"></div>
                    
                </div>
            </div>
        </main>
    </body>
</html>
