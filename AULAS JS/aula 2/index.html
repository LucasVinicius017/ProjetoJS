<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./assets/css/style.css">
        <title>Document</title>
    </head>
    <body>

        <div>
            <h1>Mude a cor de fundo</h1>
            <p>Clique no botao para alterar a cor da pagina</p>
            <button type="button" id="btnMudarCor">Mudar Cor!</button>
        </div>

        <div>
            <h1>Contador</h1>
            <p id="p2"></p>
            <button type="button" id="btnC">Contador</button>
            <button type="button" id="bntZera">Zerar</button>
        </div>

        <div>
            <h1>Calculadora de Soma</h1>
            <input type="number" id="number1">
            <p><span id="soma">+</span></p>
            <input type="number" id="number2">
            <button type="button" id="calcular1">Calcular</button>

            <h3 id="resultado1">Resultado</h3>

        </div>

        <div>

            <h1>Calculadora de Subtração</h1>
            <input type="number" id="number3">
            <p><span>-</span></p>
            <input type="number" id="number4">
            <button type="button" id="calcular2">Calcular</button>

            <h3 id="resultado2">Resultado</h3>
        </div>
        <script src="./assets/js/script.js"></script>
    </body>
</html>
